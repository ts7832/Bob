<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bob: scan a blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Fragment+Mono&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* One-bit design, the same as the team page (ui/index.html) */
  :root { --ink: #1e1e1e; --paper: #fefefe; --soft: #efefef; --muted: #66666a; --ok: #03804a; --warn: #a35a00; --bad: #c0261c;
          --pix: "VT323", ui-monospace, monospace; --mono: "Fragment Mono", ui-monospace, monospace; --sans: "Geist", system-ui, sans-serif; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 var(--sans); color: var(--ink); background: var(--paper) repeating-linear-gradient(0deg, rgba(30,30,30,.06) 0 1px, transparent 1px 3px); }
  header { display: flex; gap: 6px; height: 40px; }
  header > * { background: var(--paper); display: flex; align-items: center; padding: 0 10px; }
  header b { font: 500 19px var(--sans); }
  header span { font: 18px var(--pix); margin-left: auto; background: var(--ink); color: var(--paper); }
  main { padding: 14px 16px 60px; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--paper); border: 1px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 0 0 12px; transition: box-shadow .12s; }
  .card > :not(h2) { margin-left: 12px; margin-right: 12px; }
  .card > h2 + * { margin-top: 12px; }
  h2 { display: flex; margin: 0; padding: 3px 7px 4px; font: 20px/1 var(--pix); font-weight: 400; letter-spacing: .02em;
       background: repeating-linear-gradient(0deg, var(--ink) 0 1px, var(--paper) 1px 2px); border-bottom: 1px solid var(--ink); }
  h2 span { background: var(--paper); padding: 0 6px; }
  .card.on { outline: 3px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); }
  .card.on > h2 { background: var(--ink); color: var(--paper); }
  .card.on > h2 span { background: transparent; }
  button, .btn { font: 21px/1 var(--pix); border: 1px solid var(--ink); background: var(--paper); border-radius: 0; padding: 12px 14px 13px; display: block;
                 width: calc(100% - 24px); text-align: center; color: var(--ink); letter-spacing: .03em; cursor: pointer; }
  .primary { background: var(--ink); color: var(--paper); }
  input[type=password], input[type=text] { font: 15px var(--mono); width: calc(100% - 24px); display: block; padding: 11px; border: 1px solid var(--ink);
                                         border-radius: 0; background: var(--paper); margin-bottom: 10px; outline: 0; }
  .card.on input { border-width: 2px; padding: 10px; }
  img.sheet { width: calc(100% - 24px); display: block; border: 1px solid var(--ink); background: var(--paper); }
  .row { display: flex; gap: 0; border: 1px solid var(--ink); }
  .row > * { flex: 1; width: auto; border: 0; }
  .row > * + * { border-left: 1px solid var(--ink); }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .note { font: 13px var(--mono); color: var(--muted); margin-top: 8px; margin-bottom: 0; }
  .tag { display: inline-block; font: 16px/1 var(--pix); padding: 3px 6px 4px; border: 1px solid var(--ink); margin: 6px 4px 0 0; }
  .tag.ok { background: var(--ink); color: var(--paper); } .tag.warn { color: var(--warn); border-color: var(--warn); } .tag.bad { color: var(--bad); border-color: var(--bad); }
  ul { list-style: none; padding: 0; margin-top: 0; margin-bottom: 0; border: 1px solid var(--ink); }
  li { padding: 10px; border-top: 1px solid var(--ink); }
  li:first-child { border-top: 0; }
  .q { font: 13px var(--mono); }
  .a { font: 300 44px/1 var(--sans); letter-spacing: -.05em; margin: 6px 0 2px; }
  .total { font: 300 64px/.9 var(--sans); letter-spacing: -.06em; margin: 12px 0 10px; }
  .alert { border-color: var(--bad); box-shadow: 3px 3px 0 var(--bad); }
  .alert > h2 { background: var(--bad); color: var(--paper); }
  .alert > h2 span { background: transparent; }
  .card, li, .note, b { overflow-wrap: anywhere; min-width: 0; }
  html, body { overflow-x: hidden; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><b>Bob</b><span id="who">scan a blueprint</span></header>
<main>
  <div class="card" id="login">
    <h2><span>Workspace password</span></h2>
    <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" placeholder="Password">
    <button class="primary" id="go">Open</button>
    <p class="note" id="loginmsg"></p>
  </div>

  <div id="app" hidden>
    <div class="card">
      <h2><span>Camera</span></h2>
      <label class="btn primary" for="cam">Scan a blueprint</label>
      <input type="file" id="cam" accept="image/*" capture="environment" hidden>
      <p class="note" id="status">Point the camera at the sheet so most of it is in the picture.</p>
    </div>

    <div class="card alert" id="newer" hidden><h2><span>Out of date</span></h2><p class="note" id="newerinfo" style="color:var(--ink)"></p></div>

    <div class="card" id="match" hidden>
      <h2><span>Found in the library</span></h2>
      <img class="sheet" id="thumb" alt="">
      <p style="margin-top:8px;margin-bottom:2px"><b id="sheetname"></b></p>
      <p class="note" id="matchinfo"></p>
    </div>

    <div class="card" id="scope" hidden>
      <h2><span>Ask about</span></h2>
      <div class="row seg"><button id="one" class="on">This blueprint</button><button id="all">Whole project</button></div>
      <p class="note" id="scopeinfo"></p>
    </div>

    <div class="card" id="askcard" hidden>
      <h2><span>Question</span></h2>
      <input type="text" id="question" placeholder="e.g. How many doors are on this floor?">
      <button class="primary" id="ask">Ask</button>
      <div id="result"></div>
    </div>

    <div class="card" id="savedcard" hidden>
      <h2><span>Already answered on this blueprint</span></h2>
      <ul id="saved"></ul>
    </div>

    <div class="card" id="nomatch" hidden>
      <h2><span>Not found</span></h2>
      <p class="note" id="nomatchinfo"></p>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let pw = sessionStorage.getItem("bobpw") || "", scan = null, scopeAll = false;
const api = (path, opt = {}) => fetch(path, { ...opt, headers: { "x-bob-password": pw, ...(opt.headers || {}) } })
  .then(async (r) => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText); return r.json(); });
const money = (x) => "$" + (x || 0).toFixed(4);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const value = (a) => a == null || a.answer == null ? "cannot determine" : a.answer + (a.unit && a.unit !== "count" ? " " + a.unit : "");

async function open_() {
  pw = $("pw").value || pw;
  try {
    const r = await api("/api/login", { method: "POST" });
    sessionStorage.setItem("bobpw", pw);
    $("login").hidden = true; $("app").hidden = false; $("who").textContent = r.workspace + " workspace";
  } catch (e) { $("loginmsg").textContent = "That password was not accepted."; }
}
$("go").onclick = open_;
if (pw) open_();

$("cam").onchange = async (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  ["match", "scope", "askcard", "savedcard", "nomatch", "newer"].forEach((i) => $(i).hidden = true);
  $("status").textContent = "Looking it up...";
  try {
    const small = await shrink(f);
    scan = await api("/api/scan", { method: "POST", body: small, headers: { "content-type": "image/jpeg" } });
  } catch (e) { $("status").textContent = "Could not send the photo: " + e.message; return; }
  $("status").textContent = "Scan another blueprint any time.";
  if (!scan.matched && scan.look_alikes.length) {
    $("nomatch").hidden = false;
    $("nomatch").querySelector("h2 span").textContent = "Which one is it?";
    $("nomatchinfo").innerHTML = "These sheets look almost the same in the photo. Pick the one on the table:" +
      scan.look_alikes.map((c) => `<button style="margin-top:8px" data-id="${c.id}"><img src="/api/sheets/${c.id}/thumb?pw=${encodeURIComponent(pw)}" style="height:64px;vertical-align:middle;margin-right:10px">${esc(c.name)}</button>`).join("");
    $("nomatchinfo").querySelectorAll("button").forEach((b) => b.onclick = async () => {
      Object.assign(scan, await api(`/api/open/${b.dataset.id}?scan_id=${scan.scan_id}`), { matched: true, details: "your choice and matching" });
      $("nomatch").hidden = true; show();
    });
    return;
  }
  if (!scan.matched) {
    $("nomatch").hidden = false;
    $("nomatch").querySelector("h2 span").textContent = "Not found";
    const c = scan.candidates[0];
    $("nomatchinfo").textContent = c ? `No sheet in this workspace matches well enough. Closest: ${c.name} (${c.details} matching details; 25 are needed).`
                                     : "This workspace has no sheets yet.";
    return;
  }
  show();
};

function show() {
  const s = scan.sheet, n = scan.project.sheets.length;
  $("thumb").src = `/api/sheets/${s.id}/thumb?pw=${encodeURIComponent(pw)}`;
  $("sheetname").textContent = s.name;
  $("matchinfo").innerHTML = `Project <b>${esc(scan.project.name)}</b> · ${n} sheet${n === 1 ? "" : "s"} · matched on ${scan.details} details in ${scan.seconds}s`;
  $("match").hidden = false;
  if (scan.newer_revision) {
    $("newer").hidden = false;
    $("newerinfo").innerHTML = `<b>This paper is out of date.</b><br>A newer version is in the library: ${esc(scan.newer_revision.name)}` +
      (scan.newer_revision.revision ? ` (revision ${esc(scan.newer_revision.revision)})` : "") + "." +
      `<br><small>What changed (red: removed, blue: new):</small><img style="width:100%;margin-top:6px;border:1px solid #1e1e1e" ` +
      `src="/api/sheets/${scan.newer_revision.id}/diff/${s.id}?pw=${encodeURIComponent(pw)}" alt="changes between the versions">`;
  }
  scopeAll = false; setScope();
  $("scope").hidden = n < 2; $("askcard").hidden = false; $("result").innerHTML = "";
  showSaved(scan.saved_answers);
}

function setScope() {
  $("one").classList.toggle("on", !scopeAll); $("all").classList.toggle("on", scopeAll);
  const names = scan.project.sheets.map((s) => s.name).join(", ");
  $("scopeinfo").textContent = scopeAll ? `All ${scan.project.sheets.length} blueprints: ${names}` : `Only ${scan.sheet.name}`;
}
$("one").onclick = () => { scopeAll = false; setScope(); };
$("all").onclick = () => { scopeAll = true; setScope(); };

function showSaved(list) {
  $("savedcard").hidden = !list.length;
  $("saved").innerHTML = list.map((a) => `<li><div class="q">${esc(a.question)}</div><div class="a">${esc(value(a.answer))}</div>
    <span class="tag">${esc((a.answer.honesty || {}).tier || a.answer.tier || "")}</span><span class="tag">first cost ${money(a.cost_usd)}</span><span class="tag ok">NOW $0</span></li>`).join("");
}

$("ask").onclick = async () => {
  const question = $("question").value.trim();
  if (!question) return;
  $("result").innerHTML = '<p class="note">Asking...</p>';
  try {
    if (!scopeAll) {          // one blueprint: the same full answer as the laptop (both routers, corrections, audit), kept as asked from the phone
      $("result").innerHTML = '<p class="note">Asking... (a new question takes a few seconds; a known one is instant)</p>';
      const a = await api("/api/solve", { method: "POST", body: JSON.stringify({ question, sheet_id: scan.sheet.id, asked_from: "phone" }), headers: { "content-type": "application/json" } });
      const lib = a.library || {};
      render({ parts: [{ sheet: scan.sheet.name, status: "saved", answer: a, first_cost_usd: lib.cost_usd || 0, first_seconds: lib.first_seconds || 0, from_library: lib.from_library }] });
      return;
    }
    const body = { question, project_id: scan.project.id };
    const r = await api("/api/ask", { method: "POST", body: JSON.stringify(body), headers: { "content-type": "application/json" } });
    render(r);
    if (r.pending) poll(r);
  } catch (e) { $("result").innerHTML = `<p class="note">${esc(e.message)}</p>`; }
};

function render(r) {
  let h = "<ul>";
  for (const p of r.parts) {
    h += `<li><div class="q">${esc(p.sheet)}</div>` + (p.status === "saved"
      ? `<div class="a">${esc(value(p.answer))}</div>` + (p.from_library === false ? `<span class="tag">NEW · ${(p.first_seconds || 0).toFixed(1)}s · ${money(p.first_cost_usd)}</span>` : `<span class="tag ok">FROM LIBRARY · $0</span><span class="tag">first time ${money(p.first_cost_usd)}, ${(p.first_seconds || 0).toFixed(1)}s</span>`)
        + ((p.answer.honesty || {}).tier ? `<span class="tag">${esc(p.answer.honesty.tier)}</span>` : "") + (p.answer.corrected ? '<span class="tag ok">CORRECTED BY A PERSON</span>' : "")
      : `<div class="a">...</div><span class="tag warn">NEW QUESTION · WORKING</span>`) + "</li>";
  }
  h += "</ul>";
  if (r.total) h = `<div class="total">${esc(value(r.total))}</div><p class="note" style="margin-top:0;margin-bottom:10px">Total over ${r.parts.length} blueprints</p>` + h;
  $("result").innerHTML = h;
}

async function poll(r) {
  for (let i = 0; i < 90 && r.pending; i++) {
    await new Promise((ok) => setTimeout(ok, 2000));
    for (const p of r.parts) {
      if (p.status !== "pending") continue;
      const a = await api(`/api/answers/${p.answer_id}`);
      if (a.status === "done") { p.status = "saved"; p.answer = a.answer; p.first_cost_usd = a.cost_usd; p.first_seconds = a.seconds; r.pending--; }
    }
    render(r);
  }
}

(() => {
  const card = $("askcard"), on = (x) => card.classList.toggle("on", x);
  document.addEventListener("pointerdown", (e) => on(card.contains(e.target)));
  card.addEventListener("focusin", () => on(true));
})();

function shrink(file) {   // phones take 12 MP photos; 1600 px is plenty for matching and uploads much faster
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => b ? ok(b) : bad(new Error("could not read the photo")), "image/jpeg", 0.85);
    };
    img.onerror = () => bad(new Error("could not read the photo"));
    img.src = URL.createObjectURL(file);
  });
}
</script>
</body>
</html>
