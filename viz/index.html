<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DrawView harness</title>
    <style>
      /* same tokens as the team's demo page, so the harness looks like the integrated demo */
      :root { --bg:#f4f5f7; --panel:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6eb; --accent:#ff7a00; --chip:#eef1f5;
              color-scheme: light; font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: var(--bg); }
      body { margin: 0; }
      .h-app { display: grid; grid-template-columns: 3fr 1fr; height: 100vh; }
      #viewer { min-width: 0; height: 100vh; }
      aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
      h1 { font-size: 14px; margin: 0; }
      .mode { font-size: 11px; color: #9a3d00; background: #fff3e6; border-radius: 99px; padding: 1px 8px; margin-left: 6px; font-weight: 600; }
      select, input, button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
      form { display: flex; gap: 6px; } form input { flex: 1; min-width: 0; }
      form button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      .qs { display: flex; flex-direction: column; gap: 5px; }
      .qs button { text-align: left; background: var(--chip); border: 0; cursor: pointer; padding: 7px 9px; font-size: 12.5px; }
      .qs button:hover { background: #e2e7ee; } .qs button.on { background: #fff3e6; outline: 1px solid #ffd2a6; }
      .qs .probe { font-style: italic; }
      .ans { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13px; }
      .ans b { font-size: 20px; } .muted { color: var(--muted); } .ok { color: #14804a; } .bad { color: #b42318; }
    </style>
  </head>
  <body>
    <div class="h-app">
      <main id="viewer"></main>
      <aside>
        <h1>DrawView harness <span class="mode" id="mode"></span></h1>
        <select id="drawing"></select>
        <form id="ask"><input id="q" placeholder="Ask a question…" /><button>Ask</button></form>
        <div class="qs" id="qs"></div>
        <div id="answer"></div>
        <div id="sel" class="muted"></div>
      </aside>
    </div>
    <script type="module" src="/src/harness.ts"></script>
  </body>
</html>
