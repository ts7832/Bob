<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DrawView harness</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; background: #11151f; color: #e8ebf2; }
      body { margin: 0; }
      .h-app { display: grid; grid-template-columns: 3fr 1fr; height: 100vh; }
      #viewer { min-width: 0; height: 100vh; }
      aside { background: #171c28; border-left: 1px solid #2c3446; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      h1 { font-size: 14px; margin: 0; }
      .mode { font-size: 11px; color: #e0a100; border: 1px solid currentColor; border-radius: 99px; padding: 1px 8px; margin-left: 6px; }
      select, input, button { font: inherit; color: inherit; background: #1f2533; border: 1px solid #2c3446; border-radius: 8px; padding: 6px 8px; }
      form { display: flex; gap: 6px; } form input { flex: 1; min-width: 0; }
      .qs { display: flex; flex-direction: column; gap: 2px; }
      .qs button { text-align: left; background: none; border-color: transparent; color: #8f99ad; cursor: pointer; padding: 4px 6px; }
      .qs button:hover, .qs button.on { background: #1f2533; color: #e8ebf2; border-color: #2c3446; }
      .qs .probe { font-style: italic; }
      .ans { background: #1f2533; border: 1px solid #2c3446; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
      .ans b { font-size: 20px; } .muted { color: #8f99ad; } .ok { color: #7ee2b8; } .bad { color: #ff8f8f; }
    </style>
  </head>
  <body>
    <div class="h-app">
      <main id="viewer"></main>
      <aside>
        <h1>DrawView harness <span class="mode" id="mode"></span></h1>
        <select id="drawing"></select>
        <form id="ask"><input id="q" placeholder="Ask a question…" /><button>Ask</button></form>
        <div class="qs" id="qs"></div>
        <div id="answer"></div>
        <div id="sel" class="muted"></div>
      </aside>
    </div>
    <script type="module" src="/src/harness.ts"></script>
  </body>
</html>
