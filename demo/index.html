<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrawQA</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6eb; --accent:#ff7a00;
          --ok:#14804a; --okbg:#e5f6ec; --bad:#b42318; --badbg:#fdecea; --chip:#eef1f5; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; color:var(--ink); background:var(--bg);
         display:grid; grid-template-columns:260px 1fr 380px; grid-template-rows:52px 1fr; height:100vh; }
  header { grid-column:1/-1; display:flex; align-items:center; gap:12px; padding:0 18px; background:var(--ink); color:#fff; }
  header b { font-size:16px; letter-spacing:.3px; } header span { color:#aab; font-size:13px; }
  aside, section.side { background:var(--panel); overflow:auto; }
  aside { border-right:1px solid var(--line); padding:12px; }
  aside h3, .side h3 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:14px 4px 6px; }
  .sample { padding:9px 10px; border-radius:8px; cursor:pointer; margin-bottom:4px; }
  .sample:hover { background:var(--chip); } .sample.on { background:#fff3e6; outline:1px solid #ffd2a6; }
  .sample b { overflow-wrap:anywhere; }
  .sample small { display:block; color:var(--muted); font-size:11.5px; word-break:break-all; }
  main { position:relative; overflow:hidden; background:#fff; }
  #viewer { width:100%; height:100%; cursor:grab; display:block; } #viewer:active { cursor:grabbing; }
  #viewer svg { width:100%; height:100%; }
  .toolbar { position:absolute; left:12px; bottom:12px; display:flex; gap:6px; }
  .toolbar button, .note { background:#fff; border:1px solid var(--line); border-radius:7px; padding:5px 10px; font:inherit; font-size:12.5px; }
  .note:empty { display:none; } .note { position:absolute; right:12px; bottom:12px; color:var(--muted); max-width:60%; }
  .side { border-left:1px solid var(--line); padding:14px 16px; }
  textarea { width:100%; min-height:68px; resize:vertical; border:1px solid var(--line); border-radius:9px; padding:9px; font:inherit; }
  .ask { margin-top:8px; width:100%; padding:9px; border:0; border-radius:9px; background:var(--accent); color:#fff; font-weight:600; font-size:14px; cursor:pointer; }
  .chips { display:flex; flex-direction:column; gap:5px; }
  .chip { text-align:left; background:var(--chip); border:0; border-radius:8px; padding:7px 9px; font:inherit; font-size:12.5px; cursor:pointer; color:var(--ink); }
  .chip:hover { background:#e2e7ee; }
  .card { border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:14px; }
  .big { font-size:34px; font-weight:700; letter-spacing:-.5px; } .big small { font-size:16px; color:var(--muted); font-weight:500; }
  .badge { display:inline-block; font-size:12px; font-weight:600; border-radius:999px; padding:2px 9px; margin:6px 0; }
  .badge.ok { background:var(--okbg); color:var(--ok); } .badge.bad { background:var(--badbg); color:var(--bad); }
  .badge.none { background:var(--chip); color:var(--muted); }
  .expl { margin:8px 0; } .meta { color:var(--muted); font-size:12.5px; }
  details { margin-top:8px; font-size:12px; color:var(--muted); } pre { white-space:pre-wrap; margin:4px 0; }
  .drop { border:1.5px dashed #c3ccd8; border-radius:10px; padding:14px 10px; text-align:center; cursor:pointer; color:var(--muted); font-size:12.5px; margin-bottom:8px; }
  .drop b { display:block; color:var(--ink); font-size:13.5px; margin-bottom:2px; }
  .drop:hover, body.dragging .drop { border-color:var(--accent); background:#fff8f0; }
  .drop.busy { border-style:solid; color:var(--ink); }
  body.dragging main::after { content:"Drop the drawing to read it"; position:absolute; inset:10px; border:2px dashed var(--accent); border-radius:14px;
    background:rgba(255,122,0,.08); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:600; color:var(--accent); pointer-events:none; }
  #found:empty { display:none; }
  .warn { background:var(--badbg); color:var(--bad); border:1px solid #f5c2bd; border-radius:10px; padding:9px 11px; font-size:12.5px; margin-bottom:8px; }
  .frow { display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:7px; cursor:pointer; font-size:13px; user-select:none; }
  .frow:hover { background:var(--chip); } .frow.off { opacity:.4; }
  .frow i { width:13px; height:13px; border-radius:3px; flex:none; border:2px solid; }
  .frow span { flex:1; } .frow b { min-width:22px; text-align:right; } .frow em { font-style:normal; font-size:11px; color:var(--muted); min-width:92px; text-align:right; }
  .fgroup { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:9px 6px 2px; }
  .card a { color:var(--accent); font-weight:600; text-decoration:none; } .card a:hover { text-decoration:underline; }
  .hl, .hl * { fill:rgba(255,122,0,.45) !important; stroke:#ff7a00 !important; stroke-width:.6 !important; }
</style>
</head>
<body>
<header><b>DrawQA</b><span>answers about construction drawings, highlighted on the drawing so you can check them</span></header>
<aside><h3>Your drawing</h3>
<div class="drop" id="drop"><b>Drop a drawing here</b>or click to choose a file<br>PNG, JPG, PDF, DXF or IFC</div>
<input type="file" id="pick" accept=".png,.jpg,.jpeg,.pdf,.dxf,.ifc,.tif,.tiff,.bmp,image/*,application/pdf" hidden>
<div style="margin:0 0 10px"><input id="openfile" placeholder="or paste a file's full path, press Enter" style="width:100%;box-sizing:border-box;padding:7px 8px;border:1px solid #cfd6df;border-radius:8px;font-size:12px"></div>
<div id="mine"></div>
<h3>Examples from the dataset</h3>
<div id="samples"></div></aside>
<main>
  <div id="viewer"></div>
  <div class="toolbar"><button onclick="resetView()">Reset view</button><button onclick="clearHl()">Clear highlights</button><button id="planbtn" onclick="togglePlan()" hidden>Hide found plan</button></div>
  <div class="note" id="note"></div>
</main>
<section class="side">
  <div id="found"></div>
  <h3>Ask a question (any language)</h3>
  <textarea id="q" placeholder="e.g. How many doors are drawn on this floor plan?"></textarea>
  <button class="ask" onclick="ask()">Ask</button>
  <div id="answer"></div>
  <h3>Questions from the dataset</h3>
  <div class="chips" id="chips"></div>
</section>
<script>
const NS = "http://www.w3.org/2000/svg";
let current = null, svgEl = null, baseVB = null, hlLayer = null, planLayer = null, planOn = true, namesLayer = null;
// what the converter can find: label, colour, group. Rooms are filled areas, symbols are boxes.
const KINDS = {
  door:["Doors","#2563eb","Openings"], window:["Windows","#0d9488","Openings"],
  wc:["WC seats","#9333ea","Fixtures"], sink:["Sinks / wash basins","#db2777","Fixtures"], bathtub:["Bathtubs","#0891b2","Fixtures"],
  shower:["Showers","#4f46e5","Fixtures"], sauna_stove:["Sauna stove (kiuas)","#b45309","Fixtures"], sauna_bench:["Bench levels inside a sauna","#a16207","Fixtures"],
  bedroom:["Bedrooms","#3b82f6","Rooms"], kitchen:["Kitchens","#eab308","Rooms"], bathroom:["Bathrooms","#10b981","Rooms"],
  wc_room:["WC rooms","#a855f7","Rooms"], balcony:["Balconies","#84cc16","Rooms"], sauna_room:["Sauna rooms","#ef4444","Rooms"],
  living_room:["Living rooms","#f97316","Rooms"], dining:["Dining areas","#d97706","Rooms"], room:["Rooms (general)","#6366f1","Rooms"],
  entry:["Entrance / hall","#0ea5e9","Rooms"], storage:["Storage / closets","#78716c","Rooms"], utility:["Utility / technical","#14b8a6","Rooms"],
  dressing_room:["Dressing rooms","#ec4899","Rooms"], terrace:["Terraces / porches","#65a30d","Rooms"], garage:["Garages","#475569","Rooms"],
  other_room:["Other rooms","#94a3b8","Rooms"], unlabelled:["Rooms without a type","#9ca3af","Rooms"], wall:["Walls","#374151","Layout"],
  room:["Rooms (from labels)","#64748b","Rooms"], apartment:["Apartments","#d64545","Layout"], floor:["Floors (storeys)","#111827","Layout"] };
const HOW = { detector:"detected", linework:"exact linework", read:"read from sheet", inferred:"inferred from fixtures", outline:"outline found" };
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const STYLE = { WALL_FILL:{fill:"#3d4048",stroke:"none"}, WALL:{fill:"#3d4048",stroke:"#2b2e35",w:.01},
  ROOM_OUTLINE:{fill:"none",stroke:"#b9c3cf",w:.015}, UNIT_OUTLINE:{fill:"none",stroke:"#d64545",w:.03,dash:".25 .12"},
  DOOR:{fill:"none",stroke:"#374151",w:.015}, WINDOW:{fill:"none",stroke:"#1f8a5b",w:.02},
  FIXTURE:{fill:"none",stroke:"#6b7280",w:.012}, ANNOTATION:{fill:"none",stroke:"#999",w:.01} };

async function init() {
  const s = await (await fetch("/api/samples")).json();
  const box = document.getElementById("samples");
  s.forEach((d, i) => {
    const div = document.createElement("div"); div.className = "sample";
    div.innerHTML = `<b>${d.title}</b><small>${d.path.replace("data/","")}</small>`;
    div.onclick = () => { document.querySelectorAll(".sample").forEach(x => x.classList.remove("on")); div.classList.add("on"); history.replaceState(null, "", "?s=" + i); open(d); };
    box.appendChild(div);
  });
  const P = new URLSearchParams(location.search), idx = +(P.get("s") || 0);
  document.querySelectorAll(".sample")[idx]?.classList.add("on");
  await open(s[idx]);
  if (P.get("file")) {  // ?file=<full path> opens a local file directly
    const d = await (await fetch("/api/open?file=" + encodeURIComponent(P.get("file")))).json();
    if (!d.error) addMine(d);
  }
  if (P.get("q")) { document.getElementById("q").value = P.get("q"); ask(); }
}

function addMine(d) {
  const box = document.getElementById("mine"), div = document.createElement("div"); div.className = "sample";
  div.innerHTML = `<b>${esc(d.title)}</b><small>${esc(d.note || "your file")}</small>`;
  div.onclick = () => { document.querySelectorAll(".sample").forEach(x => x.classList.remove("on")); div.classList.add("on"); open(d); };
  box.prepend(div); div.onclick();
}

async function upload(file) {
  const drop = document.getElementById("drop"), idle = drop.innerHTML;
  drop.classList.add("busy"); drop.innerHTML = `<b>Reading ${esc(file.name)}…</b>finding doors, windows, fixtures and rooms`;
  try {
    const d = await (await fetch("/api/upload?name=" + encodeURIComponent(file.name), {method:"POST", body:file})).json();
    if (d.error) throw new Error(d.error);
    addMine(d);
  } catch (e) { document.getElementById("note").textContent = "Could not read the file: " + e.message; }
  drop.classList.remove("busy"); drop.innerHTML = idle;
}

document.addEventListener("DOMContentLoaded", () => {
  const drop = document.getElementById("drop"), pick = document.getElementById("pick");
  drop.onclick = () => pick.click();
  pick.onchange = () => { if (pick.files[0]) upload(pick.files[0]); pick.value = ""; };
  let depth = 0;  // drop anywhere on the page
  window.addEventListener("dragenter", e => { if (e.dataTransfer?.types.includes("Files")) { depth++; document.body.classList.add("dragging"); } });
  window.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; document.body.classList.remove("dragging"); } });
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => { e.preventDefault(); depth = 0; document.body.classList.remove("dragging");
    if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });
  const inp = document.getElementById("openfile");
  inp.addEventListener("keydown", async e => {
    if (e.key !== "Enter" || !inp.value.trim()) return;
    document.getElementById("note").textContent = "Reading the file…";
    const d = await (await fetch("/api/open?file=" + encodeURIComponent(inp.value.trim()))).json();
    if (d.error) { document.getElementById("note").textContent = "Could not open: " + d.error; return; }
    inp.value = ""; addMine(d);
  });
});

async function open(d) {
  current = d; planLayer = null;
  document.getElementById("answer").innerHTML = ""; document.getElementById("found").innerHTML = ""; document.getElementById("planbtn").hidden = true;
  const chips = document.getElementById("chips"); chips.innerHTML = "";
  d.questions.forEach(q => { const b = document.createElement("button"); b.className = "chip"; b.textContent = q.question;
    b.onclick = () => { document.getElementById("q").value = q.question; ask(); }; chips.appendChild(b); });
  const r = await (await fetch("/api/render?path=" + encodeURIComponent(d.path))).json();
  const v = document.getElementById("viewer"); v.innerHTML = "";
  document.getElementById("note").textContent = r.note || "";
  if (r.type === "vector") drawVector(v, r);
  else if (r.type === "svg") { v.innerHTML = r.svg; svgEl = v.querySelector("svg"); svgEl.removeAttribute("width"); svgEl.removeAttribute("height"); }
  else if (r.type === "image") { svgEl = el("svg", {viewBox:`0 0 ${r.width} ${r.height}`}, v); el("image", {href:r.url, x:0, y:0, width:r.width, height:r.height}, svgEl); }
  else { v.innerHTML = `<p style='padding:20px;color:#888'>${esc(r.note || "No drawing to show for this file.")}</p>`; svgEl = null; return; }
  baseVB = svgEl.getAttribute("viewBox").split(/[ ,]+/).map(Number);
  planLayer = el("g", {id:"plan"}, svgEl);
  namesLayer = el("g", {id:"names"}, svgEl);
  hlLayer = el("g", {id:"hl"}, svgEl);
  enableZoom(svgEl);
  try { const p = await (await fetch("/api/plan?path=" + encodeURIComponent(d.path))).json(); if (current === d && !p.error) showPlan(p, d); } catch (e) {}
  try { const T = await (await fetch("/api/tables?path=" + encodeURIComponent(d.path))).json(); if (current === d && T.length) showTables(T); } catch (e) {}
}

// The floor plan the converter found: every element drawn on the drawing, and a legend with counts.
function showPlan(p, d) {
  const warn = p.fit && (p.fit.level === "weak" || p.fit.level === "none")
    ? `<div class="warn"><b>Unfamiliar drawing style.</b> ${esc(p.fit.note.charAt(0).toUpperCase() + p.fit.note.slice(1))}.</div>` : "";
  if (!p.drawable) return;
  if (!p.items.length) { document.getElementById("found").innerHTML = (warn ? `<h3>Floor plan found on this drawing</h3>${warn}` : "") + namesCard(p); wireNames(d); showNames(p.names); return; }
  const u = Math.max(baseVB[2], baseVB[3]) / 900, AREA = new Set(["Rooms", "Layout"]);
  const order = Object.keys(KINDS), layers = {}, stats = {};
  p.items.slice().sort((a, b) => (AREA.has((KINDS[b.type] || [])[2]) ? 1 : 0) - (AREA.has((KINDS[a.type] || [])[2]) ? 1 : 0)).forEach(it => {
    const [, color, group] = KINDS[it.type] || [it.type, "#475569", "Other"];
    const g = layers[it.type] ||= el("g", {"data-type":it.type}, planLayer);
    const st = stats[it.type] ||= {n:0, how:new Set()}; st.n++; st.how.add(it.how);
    const area = AREA.has(group), line = it.type === "floor" || it.type === "apartment";
    const a = {fill:line ? "none" : color, "fill-opacity":area ? .16 : .22, stroke:color, "stroke-width":u * (line ? 2.2 : 1.6), "stroke-linejoin":"round"};
    if (line) a["stroke-dasharray"] = `${u * 7} ${u * 4}`;
    let cx, cy, node;
    if (it.pts) { node = el("polygon", {points:it.pts.map(q => q.join(",")).join(" "), ...a}, g);
      cx = it.pts.reduce((s, q) => s + q[0], 0) / it.pts.length; cy = it.pts.reduce((s, q) => s + q[1], 0) / it.pts.length; }
    else { const [x0, y0, x1, y1] = it.bbox; node = el("rect", {x:x0, y:y0, width:x1 - x0, height:y1 - y0, rx:u, ...a}, g); cx = (x0 + x1) / 2; cy = (y0 + y1) / 2; }
    const tip = el("title", {}, node);
    tip.textContent = (KINDS[it.type] || [it.type])[0] + (it.label ? " · " + it.label : "") + (it.area_m2 ? ` · ${it.area_m2} m²` : "") + ` · ${it.type_source || HOW[it.how] || it.how}` + (it.conf != null && it.how === "detector" ? ` (confidence ${Math.round(it.conf * 100)}%)` : "");
    if (area && group === "Rooms" && !it.label && it.type !== "unlabelled") {  // detector room types get their name on the drawing; labelled rooms already have text
      const top = it.pts ? Math.min(...it.pts.map(q => q[1])) : it.bbox[1];  // name along the top edge, clear of the printed room label
      const t = el("text", {x:cx, y:top + u * 19, "font-size":u * 15, "text-anchor":"middle", fill:color, "font-weight":"700", "font-family":"system-ui",
        stroke:"#fff", "stroke-width":u * 2.5, "paint-order":"stroke", "pointer-events":"none"}, g);
      t.textContent = {bedroom:"Bedroom", kitchen:"Kitchen", bathroom:"Bathroom", wc_room:"WC", balcony:"Balcony", sauna_room:"Sauna", living_room:"Living room",
        dining:"Dining", room:"Room", entry:"Entrance", storage:"Storage", utility:"Utility", dressing_room:"Dressing", terrace:"Terrace", garage:"Garage", other_room:"Other room"}[it.type] || it.type;
    }
  });
  let html = "", last = "";
  Object.keys(stats).sort((a, b) => (order.indexOf(a) + 99) % 99 - (order.indexOf(b) + 99) % 99).forEach(t => {
    const [name, color, group] = KINDS[t] || [t, "#475569", "Other"];
    if (group !== last) { html += `<div class="fgroup">${group}</div>`; last = group; }
    html += `<div class="frow" data-type="${esc(t)}"><i style="border-color:${color};background:${color}33"></i><span>${esc(name)}</span><em>${[...stats[t].how].map(h => HOW[h] || h).join(" + ")}</em><b>${stats[t].n}</b></div>`;
  });
  const det = p.items.some(i => i.how === "detector");
  document.getElementById("found").innerHTML = `<h3>Floor plan found on this drawing</h3>${warn}<div class="card" style="margin-top:0">${html}
    <div class="meta" style="margin-top:9px">${esc(p.kind)}${p.scale ? " · scale: " + esc(p.scale) : ""}${p.texts ? ` · ${p.texts} printed texts read` : ""}</div>
    <div class="meta">${det ? "“Detected” items come from a trained detector and are not deterministic; hover one for its confidence." : "Everything here was read from the file itself."} Click a row to hide or show it.</div>
    <div style="margin-top:8px"><a href="/api/sheet?path=${encodeURIComponent(d.path)}" download="${esc(d.title.split(" (")[0])}.sheet.json">Download as unified sheet (JSON)</a></div></div>${namesCard(p)}`;
  wireNames(d); showNames(p.names);
  document.querySelectorAll("#found .frow").forEach(row => row.onclick = () => {
    const off = row.classList.toggle("off"); layers[row.dataset.type]?.setAttribute("display", off ? "none" : "inline"); });
  planOn = true; planLayer.setAttribute("opacity", hlLayer.childNodes.length ? .18 : 1);  // an answer may already be showing
  const b = document.getElementById("planbtn"); b.hidden = false; b.textContent = "Hide found plan";
}

// Room names printed on an image, read by a vision model (an open list: whatever the drawing says, in any language).
let lastItems = [];
function namesCard(p) {
  if (!p.can_read_names) return "";
  if (p.items) lastItems = p.items;
  const n = p.names;
  // self-check: a name printed on the drawing whose position is inside no room that has a type on the sheet (typed by
  // the detector, or inferred from its fixtures). A room comes as a box, or as an outline (pts) once the wall model has
  // traced it.
  const typedRooms = lastItems.filter(i => (KINDS[i.type] || [])[2] === "Rooms" && (i.how === "detector" || i.how === "inferred") && (i.bbox || i.pts));
  const inPoly = (x, y, pts) => { let c = false;
    for (let a = 0, b = pts.length - 1; a < pts.length; b = a++) {
      const [xa, ya] = pts[a], [xb, yb] = pts[b];
      if ((ya > y) !== (yb > y) && x < (xb - xa) * (y - ya) / (yb - ya) + xa) c = !c; }
    return c; };
  const inside = (x, y, i) => i.pts ? inPoly(x, y, i.pts) : x >= i.bbox[0] && x <= i.bbox[2] && y >= i.bbox[1] && y <= i.bbox[3];
  const untyped = r => { const cx = (r.bbox[0] + r.bbox[2]) / 2, cy = (r.bbox[1] + r.bbox[3]) / 2;
    return !typedRooms.some(i => inside(cx, cy, i)); };
  if (!n) return `<div class="card" id="namescard"><div class="meta">The detector only knows a fixed list of room types. The names printed on the drawing can be read by a vision model.</div>
    <button class="ask" id="readnames" style="background:#7c3aed">Read room names and areas</button><div class="meta" style="margin-top:6px">Runs on a cloud GPU: 10 to 40 seconds when the service is warm, about 11 minutes when it has to start up first.</div></div>`;
  if (n.error) return `<div class="card" id="namescard"><div class="warn">${esc(n.error)}</div></div>`;
  const miss = n.rooms.filter(untyped);
  const rows = n.rooms.map(r => `<div class="frow" style="cursor:default" title="${untyped(r) ? "No room type was found here; this room is known only from its printed name." : "A typed room was also found here."}"><i style="border-color:#7c3aed;background:${untyped(r) ? "#7c3aed" : "#7c3aed22"}"></i><span>${esc(r.label)}${r.type ? ` <small style="color:var(--muted)">· ${esc(r.type)}?</small>` : ""}</span><b style="min-width:70px">${r.area == null ? "" : r.area + " m²"}</b></div>`).join("");
  const total = n.rooms.reduce((s, r) => s + (r.area || 0), 0), withArea = n.rooms.filter(r => r.area != null).length;
  return `<div class="card" id="namescard"><div class="fgroup" style="margin-top:0">Names printed on the drawing (${n.rooms.length})</div>${rows || '<div class="meta">No room name was found.</div>'}
    ${withArea ? `<div class="meta" style="margin-top:8px">${withArea} printed area(s), ${Math.round(total * 100) / 100} m² in total.</div>` : ""}
    ${miss.length ? `<div class="warn" style="margin-top:8px"><b>Self-check:</b> ${miss.length} of ${n.rooms.length} named rooms got no room type (filled squares), so they are missing from room counts: ${esc(miss.map(r => r.label).join(", "))}.</div>` : n.rooms.length ? `<div class="meta" style="margin-top:8px"><b>Self-check:</b> every named room also has a room type on the sheet.</div>` : ""}
    <div class="meta" style="margin-top:6px">The grey word after a name is the model's guess at what the name means. On our test it was wrong for about 1 in 6 Finnish abbreviations, so nothing is counted from it.</div>
    <div class="meta" style="margin-top:6px"><b>READ</b> · not deterministic · read by a vision model (${esc((n.model || "").split("/").pop())}); it can misread a letter or a digit, so each name is boxed on the drawing for checking.${n.truncated ? " The list was cut off and may be incomplete." : ""}</div></div>`;
}

function wireNames(d) {
  const b = document.getElementById("readnames"); if (!b) return;
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Reading the drawing…"; b.style.opacity = .6;
    let n; try { n = await (await fetch("/api/read", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({path:d.path})})).json(); } catch (e) { n = {error:String(e)}; }
    if (current !== d) return;
    document.getElementById("namescard").outerHTML = namesCard({can_read_names:true, names:n}); showNames(n);
  };
}

function showNames(n) {
  if (!namesLayer) return; namesLayer.innerHTML = "";
  if (!n || !n.rooms) return;
  const u = Math.max(baseVB[2], baseVB[3]) / 900;
  n.rooms.forEach(r => { const [x0, y0, x1, y1] = r.bbox, m = u * 2;
    const node = el("rect", {x:x0 - m, y:y0 - m, width:x1 - x0 + 2 * m, height:y1 - y0 + 2 * m, rx:u, fill:"none", stroke:"#7c3aed", "stroke-width":u * 1.6}, namesLayer);
    el("title", {}, node).textContent = `${r.label}${r.area == null ? "" : " · " + r.area + " m²"} · read by a vision model`; });
}

// Tables (door, window, finish schedules) read from a PDF sheet's own words and ruled lines.
function showTables(T) {
  const one = t => `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--ink)"><b>${esc(t.title || "Table")}</b> · ${t.rows.length} rows × ${t.columns.length} columns</summary>
    <div style="overflow:auto;max-height:260px;margin-top:6px"><table style="border-collapse:collapse;font-size:11px;white-space:nowrap">
    <tr>${t.columns.map(c => `<th style="border:1px solid var(--line);padding:2px 5px;background:var(--chip);text-align:left">${esc(c)}</th>`).join("")}</tr>
    ${t.rows.slice(0, 80).map(r => `<tr>${r.map(c => `<td style="border:1px solid var(--line);padding:2px 5px">${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div></details>`;
  document.getElementById("found").insertAdjacentHTML("beforeend", `<div class="card"><div class="fgroup" style="margin-top:0">Tables read from this sheet (${T.length})</div>${T.map(one).join("")}
    <div class="meta" style="margin-top:8px"><b>READ</b> · deterministic · rebuilt from the PDF's own words and ruled lines. Ask about them in plain words, e.g. “how many doors are type A1?”.</div></div>`);
}

function togglePlan() {
  if (!planLayer) return;
  planOn = !planOn; planLayer.setAttribute("display", planOn ? "inline" : "none"); planLayer.setAttribute("opacity", 1);
  namesLayer?.setAttribute("display", planOn ? "inline" : "none");
  document.getElementById("planbtn").textContent = planOn ? "Hide found plan" : "Show found plan";
}

function drawVector(v, r) {
  const [x0, y0, x1, y1] = r.bounds, pad = (x1 - x0) * .04;
  svgEl = el("svg", {viewBox:`${x0-pad} ${y0-pad} ${x1-x0+2*pad} ${y1-y0+2*pad}`}, v);
  const g = el("g", {}, svgEl);
  for (const it of r.items) {
    const st = STYLE[it.layer] || {fill:"none", stroke:"#bbb", w:.01};
    const common = {fill:st.fill, stroke:st.stroke, "stroke-width":st.w || 0, "stroke-dasharray":st.dash || "none"};
    if (it.k === "poly") el(it.closed || it.layer === "WALL_FILL" ? "polygon" : "polyline", {points:it.pts.map(p => p.join(",")).join(" "), ...common}, g);
    else if (it.k === "circle") el("circle", {cx:it.c[0], cy:it.c[1], r:it.r, ...common}, g);
    else if (it.k === "arc") {
      const rad = a => a * Math.PI / 180, [cx, cy] = it.c;
      const p0 = [cx + it.r * Math.cos(rad(it.a0)), cy - it.r * Math.sin(rad(it.a0))], p1 = [cx + it.r * Math.cos(rad(it.a1)), cy - it.r * Math.sin(rad(it.a1))];
      const large = ((it.a1 - it.a0 + 360) % 360) > 180 ? 1 : 0;
      el("path", {d:`M${p0} A${it.r},${it.r} 0 ${large} 0 ${p1}`, ...common}, g);
    } else if (it.k === "text") {
      const t = el("text", {x:it.p[0], y:it.p[1], "font-size":it.h * 1.1, "text-anchor":"middle", fill:"#374151", "font-family":"system-ui"}, g); t.textContent = it.t;
    }
  }
}

function marker(x, y, label, size) {
  const g = el("g", {}, hlLayer);
  el("circle", {cx:x, cy:y, r:size, fill:"#ff7a00", stroke:"#fff", "stroke-width":size * .18}, g);
  const t = el("text", {x, y:y + size * .38, "font-size":size * 1.05, "text-anchor":"middle", fill:"#fff", "font-weight":"700", "font-family":"system-ui"}, g);
  t.textContent = label;
}

function clearHl() { if (!svgEl) return; hlLayer.innerHTML = ""; svgEl.querySelectorAll(".hl").forEach(e => e.classList.remove("hl")); planLayer?.setAttribute("opacity", 1); }

function showEvidence(ev) {
  clearHl(); if (!svgEl || !ev.length) return;
  planLayer?.setAttribute("opacity", .18);  // the answer's evidence takes the foreground
  const size = baseVB[2] / 75, numbered = ev.length <= 150;
  ev.forEach((e, i) => {
    const lab = numbered ? (e.label && e.label.length < 4 ? e.label : String(i + 1)) : "";
    if (e.shape === "polygon") {
      el("polygon", {points:e.pts.map(p => p.join(",")).join(" "), fill:"rgba(255,122,0,.28)", stroke:"#ff7a00", "stroke-width":size * .15}, hlLayer);
      const cx = e.pts.reduce((a, p) => a + p[0], 0) / e.pts.length, cy = e.pts.reduce((a, p) => a + p[1], 0) / e.pts.length;
      if (lab) marker(cx, cy, lab, size);
    } else if (e.shape === "box") {
      const [x0, y0, x1, y1] = e.bbox, m = size * .25;
      el("rect", {x:x0 - m, y:y0 - m, width:x1 - x0 + 2 * m, height:y1 - y0 + 2 * m, rx:m, fill:"rgba(255,122,0,.25)", stroke:"#ff7a00", "stroke-width":size * .18}, hlLayer);
      if (lab) marker((x0 + x1) / 2, Math.min(y0, y1) - size * 1.1, lab, size * .8);
    } else if (e.shape === "guid") {
      svgEl.querySelectorAll(`[data-guid="${e.id}"]`).forEach(n => {
        n.classList.add("hl");
        if (lab && n.getBBox) { const b = n.getBBox(); marker(b.x + b.width / 2, b.y + b.height / 2, lab, size * .7); }
      });
    }
  });
}

async function ask() {
  const question = document.getElementById("q").value.trim(); if (!question || !current) return;
  const out = document.getElementById("answer"); out.innerHTML = `<div class="card meta">Thinking…</div>`;
  const r = await (await fetch("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({path:current.path, question})})).json();
  if (r.error) { out.innerHTML = `<div class="card"><span class="badge bad">error</span><div class="expl">${r.error}</div></div>`; return; }
  const unit = {m2:"m²", m3:"m³", m:"m", count:""}[r.unit] ?? (r.unit || "");
  const val = r.answer === null || r.answer === undefined ? "—" : r.answer;
  let badge = `<span class="badge none">no dataset answer to compare</span>`;
  if ("dataset_answer" in r) {
    const ok = r.answer !== null && (typeof r.answer === "number" ? Math.abs(r.answer - r.dataset_answer) <= Math.max(0, .02 * Math.abs(r.dataset_answer)) && (r.unit !== "count" || r.answer === r.dataset_answer) : r.answer == r.dataset_answer);
    badge = ok ? `<span class="badge ok">✓ matches dataset answer (${r.dataset_answer})</span>` : `<span class="badge bad">✗ dataset answer is ${r.dataset_answer}</span>`;
  }
  const conf = r.confidence == null ? "—" : Math.round(r.confidence * 100) + "%";
  const h = r.honesty || {};
  out.innerHTML = `<div class="card"><div class="big">${val} <small>${unit}</small></div>${badge}
    <div class="expl">${r.explanation || ""}</div>
    ${h.style_warning ? `<div class="warn" style="margin-top:8px"><b>Unfamiliar drawing style.</b> This count may be wrong.</div>` : ""}
    <div class="meta"><b>${h.tier ? h.tier.toUpperCase() : "—"}</b>${h.deterministic === true ? " · deterministic" : h.deterministic === false ? " · not deterministic" : ""} · ${h.basis || ""}</div>
    ${(r.counting || []).length ? `<div class="meta">Counting rules: ${r.counting.map(c => `${c.used ? "<b>" : ""}${c.count} — ${c.rule}${c.used ? " (used)</b>" : ""}`).join(" · ")}</div>` : ""}
    <div class="meta">Question: ${esc((r.question_read || {}).note || "")}</div>
    <div class="meta">Method: ${r.method} · confidence ${conf} · ${r.evidence.length} highlighted</div>
    <details><summary>parsed question</summary><pre>${JSON.stringify(r.intent, null, 1)}</pre></details></div>`;
  showEvidence(r.evidence || []);
}

function enableZoom(svg) {
  let vb = baseVB.slice(), drag = null;
  const apply = () => svg.setAttribute("viewBox", vb.join(" "));
  svg.addEventListener("wheel", ev => { ev.preventDefault();
    const r = svg.getBoundingClientRect(), k = ev.deltaY > 0 ? 1.15 : 1 / 1.15;
    const mx = vb[0] + (ev.clientX - r.left) / r.width * vb[2], my = vb[1] + (ev.clientY - r.top) / r.height * vb[3];
    vb = [mx - (mx - vb[0]) * k, my - (my - vb[1]) * k, vb[2] * k, vb[3] * k]; apply(); }, {passive:false});
  svg.addEventListener("mousedown", ev => drag = [ev.clientX, ev.clientY, vb[0], vb[1]]);
  window.addEventListener("mouseup", () => drag = null);
  svg.addEventListener("mousemove", ev => { if (!drag) return; const r = svg.getBoundingClientRect();
    vb[0] = drag[2] - (ev.clientX - drag[0]) / r.width * vb[2]; vb[1] = drag[3] - (ev.clientY - drag[1]) / r.height * vb[3]; apply(); });
  window.resetView = () => { vb = baseVB.slice(); apply(); };
}
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });
init();
</script>
